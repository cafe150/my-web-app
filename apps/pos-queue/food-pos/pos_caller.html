<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>呼び出し管理画面</title>
    <style>
        body { font-family: sans-serif; background: #eef2f5; padding: 20px; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        h1 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        #order-list { display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right:10px; }
        
        .order-card { background: white; border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 3px 8px rgba(0,0,0,0.08); border-left: 8px solid; }
        .status-waiting { border-left-color: #bdc3c7; background: #fdfdfd; opacity: 0.7; } 
        .status-ready { border-left-color: #3498db; } 
        .status-calling { border-left-color: #f39c12; background: #fffcf5; } 
        
        .info { flex: 1; display: flex; align-items: center; gap: 20px; }
        .num { font-size: 3.5rem; font-weight: 900; color: #333; width: 100px; text-align: center; }
        .note { font-size: 1.3rem; font-weight: bold; }
        
        .actions { display: flex; gap: 10px; }
        .btn { padding: 15px 25px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .btn-call { background: #3498db; color: white; }
        .status-calling .btn-call { background: #f39c12; }
        .btn-disabled { background: #ecf0f1; color: #95a5a6; cursor: not-allowed; }
        .btn-done { background: #95a5a6; color: white; }
    </style>
</head>
<body>

    <h1>📢 お渡し・呼び出し管理</h1>
    <div id="order-list"></div>

<script>
    const bc = new BroadcastChannel('pos_system');

    function renderCaller() {
        let orders = JSON.parse(localStorage.getItem('orders') || '[]');
        
        // ★必ず古い順に並べる
        orders.sort((a, b) => a.id - b.id);
        
        const list = document.getElementById('order-list');
        if (orders.length === 0) {
            list.innerHTML = '<h3 style="color:#7f8c8d;">注文はありません</h3>';
            return;
        }

        list.innerHTML = orders.map(o => {
            let btnHtml = '';
            if (o.status === 'waiting') {
                btnHtml = `<button class="btn btn-disabled" disabled>🍳 キッチン調理中</button>`;
            } else {
                const callText = o.status === 'calling' ? '🔊 再呼出' : '🔊 呼出';
                btnHtml = `
                    <button class="btn btn-call" onclick="callOrder(${o.id}, ${o.number})">${callText}</button>
                    <button class="btn btn-done" onclick="completeOrder(${o.id}, ${o.number})">✔ お渡し完了</button>
                `;
            }

            return `
            <div class="order-card status-${o.status}">
                <div class="info">
                    <div class="num">${o.number}</div>
                    <div class="note">${o.note}</div>
                </div>
                <div class="actions">${btnHtml}</div>
            </div>
            `;
        }).join('');
    }

    function callOrder(id, number) {
        let orders = JSON.parse(localStorage.getItem('orders') || '[]');
        const idx = orders.findIndex(o => o.id === id);
        if (idx !== -1) {
            orders[idx].status = 'calling'; 
            localStorage.setItem('orders', JSON.stringify(orders));
            bc.postMessage({ type: 'CALL', number: number }); 
            renderCaller();
        }
    }

    function completeOrder(id, number) {
        let orders = JSON.parse(localStorage.getItem('orders') || '[]');
        orders = orders.filter(o => o.id !== id);
        localStorage.setItem('orders', JSON.stringify(orders));
        bc.postMessage({ type: 'DELETE', number: number }); 
        renderCaller();
    }

    renderCaller();
    setInterval(renderCaller, 1000);
</script>
</body>
</html>
