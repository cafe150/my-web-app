<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>お客様呼び出し画面</title>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; background: #eef2f5; }
        #start-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44,62,80,0.98); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; cursor: pointer; }
        
        #left-area { flex: 7; display: flex; flex-direction: column; background: #fff; box-shadow: 5px 0 15px rgba(0,0,0,0.1); }
        #main-call { flex: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 5px solid #eef2f5; }
        #current-number { font-size: 25rem; font-weight: 900; color: #e74c3c; line-height: 1; }
        
        #waiting-area { flex: 1; background: #fdfdfd; padding: 20px; display: flex; flex-direction: column; }
        .waiting-title { font-size: 2.5rem; color: #3498db; font-weight: bold; border-bottom: 3px solid #3498db; padding-bottom: 5px; margin-bottom: 15px; }
        #waiting-list { display: flex; flex-wrap: wrap; gap: 20px; font-size: 4.5rem; font-weight: bold; color: #7f8c8d; }
        
        #history-area { flex: 3; background: #2c3e50; color: #ecf0f1; padding: 30px; display: flex; flex-direction: column; }
        .history-item { font-size: 4rem; font-weight: bold; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; text-align: center; margin-bottom: 15px; }
        
        .blink { animation: flash 1s ease-in-out 3; }
        @keyframes flash { 50% { opacity: 0.3; transform: scale(1.05); } }
    </style>
</head>
<body>
    <div id="start-overlay" onclick="this.style.display='none'; initAudio();"><h1>👆 画面をタップして開始</h1></div>
    
    <div id="left-area">
        <div id="main-call">
            <div style="font-size:3rem; color:#7f8c8d; font-weight:bold;">お呼び出し番号</div>
            <div id="current-number">--</div>
        </div>
        <div id="waiting-area">
            <div class="waiting-title">ただいま準備中の番号</div>
            <div id="waiting-list"></div>
        </div>
    </div>
    
    <div id="history-area">
        <h2 style="text-align:center; border-bottom:2px solid #34495e; padding-bottom:10px; margin-top:0;">呼び出し済み</h2>
        <div id="history-list"></div>
    </div>

    <script>
        const bc = new BroadcastChannel('pos_system');
        let history = [];
        let audioCtx;

        function initAudio() { 
            audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            // 音声合成エンジンの起動儀式
            speechSynthesis.speak(new SpeechSynthesisUtterance('')); 
        }

        function playChime(type) {
            if (!audioCtx || type === "0") return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const t = audioCtx.currentTime;

            if (type === "1") { 
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, t);
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.5);
                
                osc.frequency.setValueAtTime(659.25, t + 0.5);
                gain.gain.setValueAtTime(0.5, t + 0.5);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 1.5);
                osc.start(t); osc.stop(t + 2);

            } else if (type === "2") { 
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1046.50, t); 
                osc.frequency.setValueAtTime(1318.51, t + 0.15); 
                osc.frequency.setValueAtTime(1567.98, t + 0.3); 
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
                osc.start(t); osc.stop(t + 0.8);

            } else if (type === "3") { 
                osc.type = 'sine';
                osc.frequency.setValueAtTime(783.99, t); 
                gain.gain.setValueAtTime(0.6, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 1.5);
                osc.start(t); osc.stop(t + 1.5);
            }
        }

        bc.onmessage = (e) => {
            if (e.data.type === 'CALL') {
                const num = String(e.data.number);
                const old = document.getElementById('current-number').innerText;
                
                // ★ 1. 古い番号を履歴に追加（重複があれば古いものを消して上に持ってくる）
                if (old !== '--' && old !== num) {
                    history = history.filter(n => n !== old);
                    history.unshift(old);
                }
                
                // ★ 2. 今から呼ぶ番号が既に履歴にあれば、履歴から削除（2重表示防止）
                history = history.filter(n => n !== num);
                
                // 履歴は最大5件まで
                if (history.length > 5) history = history.slice(0, 5);
                
                // 履歴リストの再描画
                document.getElementById('history-list').innerHTML = history.map(n => `<div class="history-item">${n}</div>`).join('');
                
                // メイン番号の更新
                document.getElementById('current-number').innerText = num;
                document.getElementById('current-number').classList.remove('blink');
                void document.getElementById('current-number').offsetWidth;
                document.getElementById('current-number').classList.add('blink');
                
                const settings = JSON.parse(localStorage.getItem('audioSettings')) || {type:"1", prefix:"番号", suffix:"番の方"};
                playChime(settings.type);
                
                setTimeout(() => {
                    const uttr = new SpeechSynthesisUtterance(`${settings.prefix} ${num} ${settings.suffix}`);
                    uttr.lang = 'ja-JP';
                    speechSynthesis.speak(uttr);
                }, 1000);
            }
            if (e.data.type === 'DELETE') {
                const num = String(e.data.number);
                if (document.getElementById('current-number').innerText === num) {
                    document.getElementById('current-number').innerText = '--';
                }
                // ★ 削除時も、履歴から確実に消す
                history = history.filter(n => n !== num);
                document.getElementById('history-list').innerHTML = history.map(n => `<div class="history-item">${n}</div>`).join('');
            }
        };

        function updateWaitingList() {
            let orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.sort((a,b) => a.id - b.id); 
            let waitingNums = orders.filter(o => o.status === 'waiting' || o.status === 'ready').map(o => o.number);
            document.getElementById('waiting-list').innerHTML = waitingNums.map(n => `<span>${n}</span>`).join(' , ');
        }
        
        setInterval(updateWaitingList, 1000);
    </script>
</body>
</html>
