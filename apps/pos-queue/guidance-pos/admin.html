<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>受付システム</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; background: #eef2f5; justify-content: center; align-items: center; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 650px; }
        .header { border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
        .input-l { width: 100%; padding: 15px; font-size: 1.2rem; border: 2px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; }
        .quick-btns { display: flex; gap: 5px; margin-top: 5px; }
        .btn-quick { flex: 1; padding: 8px; background: #ecf0f1; border: 1px solid #bdc3c7; border-radius: 5px; cursor: pointer; font-weight: bold; color: #34495e; text-align: center; }
        .exp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .exp-btn { display: flex; align-items: center; background: #f8f9fa; border: 2px solid #e0e0e0; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .exp-btn input { margin-right: 10px; transform: scale(1.5); }
        .exp-btn:has(input:checked) { background: #ebf5fb; border-color: #3498db; }
        .submit-btn { width: 100%; padding: 20px; font-size: 1.5rem; background: #3498db; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:1000; }
        .modal-content { background:#fff; padding:30px; border-radius:12px; width:450px; text-align:center; }

        /* 予約時間・案内目安スタイル */
        .time-setting-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 16px; margin-bottom: 20px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.03); }
        .time-setting-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .time-label { font-weight: bold; font-size: 1.05rem; color: #1e293b; }
        .time-status-badge { font-size: 0.92rem; font-weight: bold; padding: 5px 14px; border-radius: 20px; transition: all 0.2s ease; }
        .time-status-badge.none { background: #e2e8f0; color: #475569; }
        .time-status-badge.reserved { background: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
        .time-status-badge.manual { background: #fef3c7; color: #b45309; border: 1px solid #fbbf24; }

        .time-row { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
        .time-row:last-child { margin-bottom: 0; }
        .sub-label { font-size: 0.88rem; font-weight: bold; color: #475569; width: 105px; flex-shrink: 0; }
        
        .quick-pill-group { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
        .btn-pill { flex: 1; min-width: 60px; padding: 9px 8px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: bold; font-size: 0.95rem; color: #334155; cursor: pointer; transition: all 0.15s ease; text-align: center; }
        .btn-pill:hover { background: #f1f5f9; border-color: #94a3b8; }
        .btn-pill.active { background: #3b82f6; color: #fff; border-color: #2563eb; box-shadow: 0 2px 4px rgba(37,99,235,0.25); }
        .btn-pill-reset { flex: 1.2; background: #f1f5f9; color: #64748b; }
        .btn-pill-reset.active { background: #475569; color: #fff; border-color: #334155; }

        .slot-btn-group { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
        .btn-slot { padding: 8px 12px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: bold; font-size: 0.95rem; color: #1e293b; cursor: pointer; transition: all 0.15s ease; min-width: 62px; text-align: center; }
        .btn-slot:hover { background: #e0f2fe; border-color: #38bdf8; }
        .btn-slot.active { background: #0284c7; color: #fff; border-color: #0369a1; box-shadow: 0 2px 4px rgba(2,132,199,0.25); }

        .time-custom-controls { display: flex; align-items: center; gap: 6px; flex: 1; flex-wrap: wrap; }
        .time-select { padding: 7px 10px; font-size: 0.95rem; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-weight: bold; color: #1e293b; cursor: pointer; }
        .time-colon { font-weight: bold; font-size: 1.1rem; color: #475569; }
        .minute-pill-group { display: flex; gap: 4px; }
        .btn-min { padding: 6px 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: bold; font-size: 0.9rem; color: #334155; cursor: pointer; }
        .btn-min:hover { background: #f1f5f9; }
        .btn-min.active { background: #3b82f6; color: #fff; border-color: #2563eb; }
        .input-time-native { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }

        .wait-inputs { display: flex; align-items: center; gap: 8px; flex: 1; flex-wrap: wrap; }
        .input-s { width: 85px; padding: 7px 10px; font-size: 0.95rem; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; text-align: right; }
        .btn-pill-sm { padding: 6px 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 0.88rem; font-weight: bold; color: #475569; cursor: pointer; }
        .btn-pill-sm:hover { background: #f1f5f9; }
        .btn-pill-sm.active { background: #d97706; color: #fff; border-color: #b45309; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h2 style="margin:0; color:#2c3e50;">📋 順番待ち受付</h2></div>
    
    <div style="display:flex; gap:20px;">
        <div class="form-group" style="flex:2;">
            <label>👤 お名前（カタカナ）</label>
            <input type="text" id="r-name" class="input-l" placeholder="例：ヤマダ">
        </div>
        <div class="form-group" style="flex:1;">
            <label>👥 人数</label>
            <input type="number" id="r-pax" class="input-l" value="1" min="1">
            <div class="quick-btns">
                <div class="btn-quick" onclick="document.getElementById('r-pax').value=1">1名</div>
                <div class="btn-quick" onclick="document.getElementById('r-pax').value=2">2名</div>
                <div class="btn-quick" onclick="document.getElementById('r-pax').value=3">3名</div>
                <div class="btn-quick" onclick="document.getElementById('r-pax').value=4">4名</div>
            </div>
        </div>
    </div>
    
    <!-- 予約時間・案内目安設定エリア -->
    <div class="time-setting-card">
        <div class="time-setting-header">
            <label class="time-label">🕒 予約時間・案内目安</label>
            <div id="time-status-badge" class="time-status-badge none">予約なし（通常待ち）</div>
        </div>

        <!-- クイック加算ボタン -->
        <div class="time-row">
            <span class="sub-label">目安・加算:</span>
            <div class="quick-pill-group">
                <button type="button" class="btn-pill btn-pill-reset active" onclick="clearReservation()">予約なし</button>
                <button type="button" class="btn-pill" onclick="addMinutesToReservation(15)">+15分</button>
                <button type="button" class="btn-pill" onclick="addMinutesToReservation(30)">+30分</button>
                <button type="button" class="btn-pill" onclick="addMinutesToReservation(45)">+45分</button>
                <button type="button" class="btn-pill" onclick="addMinutesToReservation(60)">+60分</button>
            </div>
        </div>

        <!-- 直近枠スロットボタン (15分刻み) -->
        <div class="time-row">
            <span class="sub-label">直近の時間枠:</span>
            <div id="slot-container" class="slot-btn-group"></div>
        </div>

        <!-- 時刻直接選択 (時/分セレクタ + 従来型time入力) -->
        <div class="time-row time-detail-row">
            <span class="sub-label">時刻指定:</span>
            <div class="time-custom-controls">
                <select id="r-hour-select" class="time-select" onchange="onCustomTimeSelect()">
                    <option value="">--時</option>
                </select>
                <span class="time-colon">:</span>
                <div class="minute-pill-group">
                    <button type="button" class="btn-min" onclick="setMinute(0)">00</button>
                    <button type="button" class="btn-min" onclick="setMinute(15)">15</button>
                    <button type="button" class="btn-min" onclick="setMinute(30)">30</button>
                    <button type="button" class="btn-min" onclick="setMinute(45)">45</button>
                </div>
                <input type="time" id="r-time" class="input-time-native" onchange="onNativeTimeChange(this.value)">
            </div>
        </div>

        <!-- 手動待ち時間 (任意) -->
        <div class="time-row wait-manual-row">
            <span class="sub-label">手動待ち分数:</span>
            <div class="wait-inputs">
                <input type="number" id="r-manual-wait" class="input-s" placeholder="自動計算" min="0" oninput="updateTimeBadge()">
                <div class="quick-pill-group">
                    <button type="button" class="btn-pill-sm" onclick="setManualWait('')">自動</button>
                    <button type="button" class="btn-pill-sm" onclick="setManualWait(10)">10分</button>
                    <button type="button" class="btn-pill-sm" onclick="setManualWait(15)">15分</button>
                    <button type="button" class="btn-pill-sm" onclick="setManualWait(20)">20分</button>
                    <button type="button" class="btn-pill-sm" onclick="setManualWait(30)">30分</button>
                </div>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>✨ 体験希望（必須・複数可）</label>
        <div id="exp-container" class="exp-grid"></div>
    </div>

    <button class="submit-btn" onclick="openConfirm()">確認して発券する</button>
</div>

<div id="confirm-modal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0;">受付内容の確認</h2>
        <div id="m-details" style="font-size:1.3rem; text-align:left; margin: 20px 0; line-height:1.8; background:#f9f9f9; padding:15px; border-radius:8px;"></div>
        <button class="submit-btn" style="background:#2ecc71;" onclick="finalize()">確定・発券</button>
        <button onclick="document.getElementById('confirm-modal').style.display='none'" style="width:100%; margin-top:10px; padding:15px; border:none; background:#ccc; border-radius:5px; font-weight:bold; font-size:1.2rem;">修正する</button>
    </div>
</div>

<script>
    const bc = new BroadcastChannel('queue_system');

    document.getElementById('r-name').addEventListener('blur', function() {
        this.value = this.value.replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60));
    });

    function loadExps() {
        let exps = JSON.parse(localStorage.getItem('expMaster')) || [{name: "体験", duration: 5}];
        if(typeof exps[0] === 'string') exps = exps.map(e => ({name:e, duration:5})); 
        document.getElementById('exp-container').innerHTML = exps.map(e => `
            <label class="exp-btn"><input type="checkbox" class="exp-check" value="${e.name}"> ${e.name}</label>
        `).join('');
    }

    // === 予約時間コントロール制御 ===
    let selectedMinutesOffset = null;

    function initTimeControls() {
        const hourSelect = document.getElementById('r-hour-select');
        hourSelect.innerHTML = '<option value="">--時</option>';
        for (let h = 0; h < 24; h++) {
            const hStr = String(h).padStart(2, '0');
            const opt = document.createElement('option');
            opt.value = hStr;
            opt.textContent = `${hStr}時`;
            hourSelect.appendChild(opt);
        }

        renderSlots();
        updateTimeBadge();
        setInterval(renderSlots, 60000); // 1分毎にスロット枠を最新化
    }

    function renderSlots() {
        const container = document.getElementById('slot-container');
        if (!container) return;
        const now = new Date();
        const currentM = now.getMinutes();
        
        let slotDate = new Date(now);
        let rem = currentM % 15;
        let addM = (rem === 0) ? 15 : (15 - rem);
        slotDate.setMinutes(currentM + addM, 0, 0);

        const currentVal = document.getElementById('r-time').value;
        let html = '';
        for (let i = 0; i < 6; i++) {
            const hStr = String(slotDate.getHours()).padStart(2, '0');
            const mStr = String(slotDate.getMinutes()).padStart(2, '0');
            const timeStr = `${hStr}:${mStr}`;
            const isActive = (currentVal === timeStr) ? 'active' : '';
            html += `<button type="button" class="btn-slot ${isActive}" onclick="setSlotTime('${timeStr}')">${timeStr}</button>`;
            slotDate.setMinutes(slotDate.getMinutes() + 15);
        }
        container.innerHTML = html;
    }

    function clearReservation() {
        document.getElementById('r-time').value = '';
        document.getElementById('r-hour-select').value = '';
        selectedMinutesOffset = null;
        updateTimeBadge();
    }

    function addMinutesToReservation(minutes) {
        selectedMinutesOffset = minutes;
        const target = new Date(Date.now() + minutes * 60000);
        const hStr = String(target.getHours()).padStart(2, '0');
        const mStr = String(target.getMinutes()).padStart(2, '0');
        const timeStr = `${hStr}:${mStr}`;
        
        document.getElementById('r-time').value = timeStr;
        document.getElementById('r-hour-select').value = hStr;
        updateTimeBadge();
    }

    function setSlotTime(timeStr) {
        selectedMinutesOffset = null;
        document.getElementById('r-time').value = timeStr;
        const [h] = timeStr.split(':');
        document.getElementById('r-hour-select').value = h;
        updateTimeBadge();
    }

    function setMinute(min) {
        let hour = document.getElementById('r-hour-select').value;
        if (!hour) {
            hour = String(new Date().getHours()).padStart(2, '0');
            document.getElementById('r-hour-select').value = hour;
        }
        const mStr = String(min).padStart(2, '0');
        const timeStr = `${hour}:${mStr}`;
        selectedMinutesOffset = null;
        document.getElementById('r-time').value = timeStr;
        updateTimeBadge();
    }

    function onCustomTimeSelect() {
        const hour = document.getElementById('r-hour-select').value;
        if (!hour) {
            clearReservation();
            return;
        }
        let currentVal = document.getElementById('r-time').value;
        let minute = '00';
        if (currentVal && currentVal.includes(':')) {
            minute = currentVal.split(':')[1];
        }
        selectedMinutesOffset = null;
        document.getElementById('r-time').value = `${hour}:${minute}`;
        updateTimeBadge();
    }

    function onNativeTimeChange(val) {
        selectedMinutesOffset = null;
        if (val) {
            const [h] = val.split(':');
            document.getElementById('r-hour-select').value = h;
        } else {
            document.getElementById('r-hour-select').value = '';
        }
        updateTimeBadge();
    }

    function setManualWait(val) {
        document.getElementById('r-manual-wait').value = val;
        updateTimeBadge();
    }

    function updateTimeBadge() {
        const timeVal = document.getElementById('r-time').value;
        const mWaitVal = document.getElementById('r-manual-wait').value;
        const badge = document.getElementById('time-status-badge');

        document.querySelectorAll('.quick-pill-group .btn-pill').forEach(btn => {
            btn.classList.remove('active');
            if (!timeVal && btn.classList.contains('btn-pill-reset')) {
                btn.classList.add('active');
            } else if (selectedMinutesOffset && btn.textContent.includes(`+${selectedMinutesOffset}分`)) {
                btn.classList.add('active');
            }
        });

        document.querySelectorAll('.slot-btn-group .btn-slot').forEach(btn => {
            if (btn.textContent.trim() === timeVal) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        if (timeVal) {
            const [h, m] = timeVal.split(':');
            document.getElementById('r-hour-select').value = h;
            document.querySelectorAll('.minute-pill-group .btn-min').forEach(btn => {
                if (btn.textContent.trim() === m) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        } else {
            document.querySelectorAll('.minute-pill-group .btn-min').forEach(btn => btn.classList.remove('active'));
        }

        document.querySelectorAll('.wait-inputs .btn-pill-sm').forEach(btn => {
            btn.classList.remove('active');
            if (mWaitVal === '' && btn.textContent === '自動') {
                btn.classList.add('active');
            } else if (mWaitVal !== '' && btn.textContent === `${mWaitVal}分`) {
                btn.classList.add('active');
            }
        });

        if (timeVal) {
            badge.className = 'time-status-badge reserved';
            const now = new Date();
            const [th, tm] = timeVal.split(':').map(Number);
            const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), th, tm, 0);
            const diffMin = Math.round((target.getTime() - now.getTime()) / 60000);
            
            let diffText = '';
            if (diffMin > 0) {
                diffText = ` (約${diffMin}分後)`;
            } else if (diffMin === 0) {
                diffText = ' (まもなく)';
            } else {
                diffText = ` (${Math.abs(diffMin)}分前・過去時刻)`;
            }
            badge.textContent = `🕒 ${timeVal} 予約${diffText}`;
        } else if (mWaitVal !== '') {
            badge.className = 'time-status-badge manual';
            badge.textContent = `⏳ 手動待ち: ${mWaitVal}分`;
        } else {
            badge.className = 'time-status-badge none';
            badge.textContent = '予約なし（通常待ち）';
        }
    }

    function openConfirm() {
        const nameInput = document.getElementById('r-name');
        nameInput.value = nameInput.value.replace(/[\u3041-\u3096]/g, m => String.fromCharCode(m.charCodeAt(0) + 0x60));

        const selectedExps = Array.from(document.querySelectorAll('.exp-check:checked')).map(cb => cb.value);
        if (selectedExps.length === 0) return alert("⚠️ 体験希望を少なくとも1つ選択してください。");

        const name = nameInput.value.trim() || 'お客様';
        const pax = document.getElementById('r-pax').value;
        const time = document.getElementById('r-time').value || '指定なし';
        const mWait = document.getElementById('r-manual-wait').value;
        const waitText = mWait === '' ? '自動計算' : `${mWait} 分`;

        let timeDesc = time;
        if (time !== '指定なし') {
            const now = new Date();
            const [th, tm] = time.split(':').map(Number);
            const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), th, tm, 0);
            const diffMin = Math.round((target.getTime() - now.getTime()) / 60000);
            if (diffMin > 0) timeDesc += ` (約${diffMin}分後)`;
            else if (diffMin === 0) timeDesc += ' (まもなく)';
        }

        document.getElementById('m-details').innerHTML = `
            <strong>お名前:</strong> ${name} 様 (${pax} 名)<br>
            <strong>予　約:</strong> ${timeDesc}<br>
            <strong>手　動:</strong> ${waitText}<br>
            <strong>体　験:</strong> ${selectedExps.join(' / ')}
        `;
        document.getElementById('confirm-modal').style.display='flex';
    }

    function finalize() {
        const name = document.getElementById('r-name').value.trim() || 'お客様';
        const pax = document.getElementById('r-pax').value;
        const time = document.getElementById('r-time').value || '指定なし';
        const mWaitStr = document.getElementById('r-manual-wait').value;
        const manualWait = mWaitStr === '' ? null : parseInt(mWaitStr, 10);
        const selectedExps = Array.from(document.querySelectorAll('.exp-check:checked')).map(cb => cb.value);

        let orders = JSON.parse(localStorage.getItem('queue_orders') || '[]');
        let nextNum = parseInt(localStorage.getItem('queue_nextNum') || '1');
        
        // ★ 作成時間（Date.now()）がリアルタイムカウントダウンの基準になります
        orders.push({ 
            id: Date.now(), 
            number: nextNum, 
            name: name, 
            pax: pax, 
            time: time, 
            manualWait: manualWait, // 任意の待ち時間を保存
            experiences: selectedExps, 
            status: 'waiting' 
        });
        
        localStorage.setItem('queue_orders', JSON.stringify(orders));
        localStorage.setItem('queue_nextNum', nextNum + 1);
        bc.postMessage({ type: 'NEW_ORDER' });

        alert(`発券しました！【 整理番号: ${nextNum} 番 】`);
        
        document.getElementById('r-name').value = '';
        document.getElementById('r-pax').value = '1';
        clearReservation();
        setManualWait('');
        document.querySelectorAll('.exp-check').forEach(cb => cb.checked = false);
        document.getElementById('confirm-modal').style.display='none';
    }

    loadExps();
    initTimeControls();
</script>
</body>
</html>
