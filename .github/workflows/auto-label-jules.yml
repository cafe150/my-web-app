name: Ask Jules on Label Trigger

on:
  issues:
    types: [labeled] # ラベルが付与されたイベントのみを監視

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch-jules:
    # 付与されたラベルの名前が厳密に 'jules' である場合のみジョブを実行
    if: github.event.label.name == 'jules'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Acknowledge & Prepare Prompt
        id: prepare_prompt
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Jules向けタスクプロンプトの構成
            const prompt = [
              `Please resolve GitHub Issue #${issue.number}:${issue.title}`,
              ``,
              `Requirements:`,
              `1. Review the issue description, reproduction steps, and error logs.`,
              `2. Identify the root cause and implement code changes following repository guidelines.`,
              `3. Add or update unit tests to verify the fix and prevent regressions.`,
              `4. Run the project tests and ensure all tests pass.`,
              `5. Create a Pull Request with a clear explanation of changes.`
            ].join('\n');

            core.setOutput('jules_prompt', prompt);

            // 受付確認コメントをIssueに自動投稿
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `🤖 **Jules 自動修正タスクを開始しました**\n\n\`jules\` ラベルの付与を検知したため、作業セッションをトリガーしました。\n修正が完了しテストが通り次第、自動でPRが作成されます。`
            });

      - name: Dispatch Task
        run: |
          echo "Dispatched Jules for Issue #${{ github.event.issue.number }}"
          echo "Target Prompt: ${{ steps.prepare_prompt.outputs.jules_prompt }}"
